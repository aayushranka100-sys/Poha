<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indori Poha Lovera | Authentic Indori Poha in Mumbai</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #D4A574;
            --secondary-color: #8B4513;
            --accent-color: #FFD700;
            --text-dark: #2C1810;
            --text-light: #F5F5F5;
            --bg-light: #FFF8F0;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-dark);
            line-height: 1.6;
            background-color: var(--bg-light);
        }

        /* Header & Navigation */
        header {
            background: linear-gradient(135deg, var(--secondary-color) 0%, var(--primary-color) 100%);
            color: var(--text-light);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        /* Mobile Menu Toggle */
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(rgba(139, 69, 19, 0.7), rgba(139, 69, 19, 0.7)), url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600"><rect fill="%23FFF8F0" width="1200" height="600"/></svg>');
            background-size: cover;
            background-position: center;
            color: var(--text-light);
            padding: 6rem 1.5rem;
            text-align: center;
        }

        .hero-content h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .hero-content .tagline {
            font-size: 1.8rem;
            color: var(--accent-color);
            margin-bottom: 2rem;
            font-style: italic;
        }

        .hero-content p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .cta-button {
            display: inline-block;
            background-color: var(--accent-color);
            color: var(--text-dark);
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* Section Styling */
        section {
            padding: 4rem 1.5rem;
        }

        section h2 {
            font-size: 2.5rem;
            color: var(--secondary-color);
            margin-bottom: 2rem;
            text-align: center;
        }

        /* About Section */
        .about {
            background-color: white;
        }

        .about-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: center;
        }

        .about-text h3 {
            color: var(--primary-color);
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .about-text p {
            margin-bottom: 1rem;
            line-height: 1.8;
        }

        .about-image {
            text-align: center;
        }

        .about-image img {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: var(--shadow);
        }

        /* Menu Section */
        .menu {
            background-color: var(--bg-light);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .menu-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .menu-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .menu-card-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        }

        .menu-card-content {
            padding: 1.5rem;
        }

        .menu-card h3 {
            color: var(--secondary-color);
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }

        .menu-card p {
            color: #666;
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }

        .menu-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .add-to-order {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .add-to-order:hover {
            background-color: var(--secondary-color);
        }

        /* Contact Section */
        .contact {
            background: linear-gradient(135deg, var(--secondary-color) 0%, var(--primary-color) 100%);
            color: var(--text-light);
        }

        .contact h2 {
            color: var(--accent-color);
        }

        .contact-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .contact-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 10px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .contact-card h3 {
            margin-bottom: 1rem;
            color: var(--accent-color);
        }

        .contact-card p {
            font-size: 1.1rem;
        }

        .contact-card a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
        }

        .contact-card a:hover {
            text-decoration: underline;
        }

        /* Footer */
        footer {
            background-color: var(--text-dark);
            color: var(--text-light);
            text-align: center;
            padding: 2rem;
        }

        footer p {
            margin-bottom: 0.5rem;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .hero-content h1 {
                font-size: 2.5rem;
            }

            .hero-content .tagline {
                font-size: 1.4rem;
            }

            nav ul {
                display: none;
                position: absolute;
                top: 60px;
                left: 0;
                right: 0;
                flex-direction: column;
                background-color: var(--secondary-color);
                padding: 1rem;
                gap: 0;
            }

            nav ul.active {
                display: flex;
            }

            nav ul li {
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                padding: 0.8rem 0;
            }

            .menu-toggle {
                display: block;
            }

            .about-content {
                grid-template-columns: 1fr;
            }

            section h2 {
                font-size: 2rem;
            }

            .hero {
                padding: 3rem 1.5rem;
            }

            section {
                padding: 2rem 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .hero-content h1 {
                font-size: 2rem;
            }

            .hero-content .tagline {
                font-size: 1.2rem;
            }

            .menu-grid {
                grid-template-columns: 1fr;
            }

            .cta-button {
                padding: 0.8rem 2rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-container">
            <div class="logo">🍛 Indori Poha Lovera</div>
            <button class="menu-toggle" id="menuToggle">☰</button>
            <nav>
                <ul id="navMenu">
                    <li><a href="#home">Home</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#menu">Menu</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero" id="home">
        <div class="hero-content">
            <h1>Indori Poha Lovera</h1>
            <p class="tagline">"Wait is over for Indori Poha Lovera"</p>
            <p>Experience the authentic taste of Indore's most beloved breakfast dish, freshly prepared and delivered to your doorstep.</p>
            <button class="cta-button" onclick="document.getElementById('menu').scrollIntoView({behavior: 'smooth'})">Order Now</button>
        </div>
    </section>

    <!-- About Section -->
    <section class="about" id="about">
        <div class="container">
            <h2>About Us</h2>
            <div class="about-content">
                <div class="about-text">
                    <h3>Authentic Indori Poha Since Day One</h3>
                    <p>At <strong>Indori Poha Lovera</strong>, we bring you the authentic taste of Indore's most iconic breakfast dish. Made with premium flattened rice, fresh potatoes, and a perfect blend of Indori spices, every bowl is a celebration of tradition.</p>
                    <p>✓ Fresh ingredients sourced daily</p>
                    <p>✓ Traditional Indori recipe</p>
                    <p>✓ Quick delivery across Mumbai</p>
                    <p>✓ No preservatives or artificial flavours</p>
                </div>
                <div class="about-image">
                    <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" style="max-width: 100%; height: auto;">
                        <circle cx="150" cy="150" r="140" fill="#D4A574"/>
                        <circle cx="150" cy="150" r="130" fill="#FFD700"/>
                        <ellipse cx="150" cy="150" rx="100" ry="95" fill="#FFA500"/>
                        <circle cx="130" cy="130" r="8" fill="#8B4513"/>
                        <circle cx="170" cy="140" r="8" fill="#8B4513"/>
                        <circle cx="150" cy="170" r="8" fill="#8B4513"/>
                        <text x="150" y="220" font-size="20" text-anchor="middle" fill="#8B4513" font-weight="bold">Indori Poha</text>
                    </svg>
                </div>
            </div>
        </div>
    </section>

    <!-- Menu Section -->
    <section class="menu" id="menu">
        <div class="container">
            <h2>Our Menu</h2>
            <div class="menu-grid">
                <!-- Classic Indori Poha -->
                <div class="menu-card">
                    <div class="menu-card-image" style="background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%); display: flex; align-items: center; justify-content: center; color: #8B4513; font-size: 4rem;">🍛</div>
                    <div class="menu-card-content">
                        <h3>Classic Indori Poha</h3>
                        <p>The signature dish! Freshly beaten rice, boiled potatoes, onions, sev, and a splash of lemon juice. Topped with coriander and served with hot chutney.</p>
                        <div class="menu-card-footer">
                            <span class="price">₹40</span>
                            <button class="add-to-order" onclick="alert('Item added to cart! 🎉')">Add to Cart</button>
                        </div>
                    </div>
                </div>

                <!-- Spicy Masala Indori Poha -->
                <div class="menu-card">
                    <div class="menu-card-image" style="background: linear-gradient(135deg, #FF6347 0%, #FFD700 100%); display: flex; align-items: center; justify-content: center; color: #FFF; font-size: 4rem;">🌶️</div>
                    <div class="menu-card-content">
                        <h3>Spicy Masala Indori Poha</h3>
                        <p>For the spice lovers! Our classic poha infused with extra red chilli powder, cumin, and Indori masala for that authentic kick.</p>
                        <div class="menu-card-footer">
                            <span class="price">₹50</span>
                            <button class="add-to-order" onclick="alert('Item added to cart! 🎉')">Add to Cart</button>
                        </div>
                    </div>
                </div>

                <!-- Poha with Extra Sev -->
                <div class="menu-card">
                    <div class="menu-card-image" style="background: linear-gradient(135deg, #FFD700 0%, #DAA520 100%); display: flex; align-items: center; justify-content: center; color: #8B4513; font-size: 4rem;">✨</div>
                    <div class="menu-card-content">
                        <h3>Poha with Extra Sev</h3>
                        <p>Crunch lovers, this one's for you! Our classic Indori poha loaded with extra crispy sev and a generous drizzle of tamarind chutney.</p>
                        <div class="menu-card-footer">
                            <span class="price">₹55</span>
                            <button class="add-to-order" onclick="alert('Item added to cart! 🎉')">Add to Cart</button>
                        </div>
                    </div>
                </div>

                <!-- Poha Combo (Poha + Jalebi) -->
                <div class="menu-card">
                    <div class="menu-card-image" style="background: linear-gradient(135deg, #FFD700 0%, #FF69B4 100%); display: flex; align-items: center; justify-content: center; color: white; font-size: 4rem;">🎁</div>
                    <div class="menu-card-content">
                        <h3>Poha Combo</h3>
                        <p>The perfect breakfast combo! Classic Indori poha paired with fresh, crispy jalebi. Sweet meets savoury in this iconic Indori breakfast.</p>
                        <div class="menu-card-footer">
                            <span class="price">₹90</span>
                            <button class="add-to-order" onclick="alert('Item added to cart! 🎉')">Add to Cart</button>
                        </div>
                    </div>
                </div>

                <!-- Poha with Puri -->
                <div class="menu-card">
                    <div class="menu-card-image" style="background: linear-gradient(135deg, #D2B48C 0%, #FFD700 100%); display: flex; align-items: center; justify-content: center; color: #8B4513; font-size: 4rem;">🥘</div>
                    <div class="menu-card-content">
                        <h3>Poha with Puri</h3>
                        <p>A hearty breakfast option! Fluffy fried puri served alongside our classic Indori poha with all the traditional toppings.</p>
                        <div class="menu-card-footer">
                            <span class="price">₹65</span>
                            <button class="add-to-order" onclick="alert('Item added to cart! 🎉')">Add to Cart</button>
                        </div>
                    </div>
                </div>

                <!-- Poha Bowl (Large) -->
                <div class="menu-card">
                    <div class="menu-card-image" style="background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%); display: flex; align-items: center; justify-content: center; color: #8B4513; font-size: 4rem;">🍚</div>
                    <div class="menu-card-content">
                        <h3>Poha Bowl (Large)</h3>
                        <p>Extra hungry? Our large-sized Indori poha bowl serves 2 people. Perfect for sharing or for those with a big appetite!</p>
                        <div class="menu-card-footer">
                            <span class="price">₹75</span>
                            <button class="add-to-order" onclick="alert('Item added to cart! 🎉')">Add to Cart</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Contact Section -->
    <section class="contact" id="contact">
        <div class="container">
            <h2>Get in Touch</h2>
            <div class="contact-info">
                <div class="contact-card">
                    <h3>📍 Location</h3>
                    <p>Fort, Mumbai<br>Maharashtra, India</p>
                </div>
                <div class="contact-card">
                    <h3>📞 Phone</h3>
                    <p><a href="tel:+919876543210">+91 98765 43210</a></p>
                </div>
                <div class="contact-card">
                    <h3>⏰ Hours</h3>
                    <p>Mon - Sun<br>6:00 AM - 1:00 PM</p>
                </div>
                <div class="contact-card">
                    <h3>💬 WhatsApp</h3>
                    <p><a href="https://wa.me/919876543210" target="_blank">Order via WhatsApp</a></p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Indori Poha Lovera. All rights reserved.</p>
        <p>Bringing authentic Indori taste to Mumbai | 🍛 Quality & Taste Guaranteed</p>
    </footer>

    <script>
        // Mobile Menu Toggle
        const menuToggle = document.getElementById('menuToggle');
        const navMenu = document.getElementById('navMenu');

        menuToggle.addEventListener('click', () => {
            navMenu.classList.toggle('active');
        });

        // Close menu when a link is clicked
        const navLinks = navMenu.querySelectorAll('a');
        navLinks.forEach(link => {
            link.addEventListener('click', () => {
                navMenu.classList.remove('active');
            });
        });
    </script>
</body>
</html>
